	<details>

	<settings section="generale"></settings>
	<details class="experiment-exist soundpack">
		<summary class="settings-section-title">
			<span data-i18n-key="settings.sections.uis"></span>
			<span><img src="/app/shared/icons/uisounds.svg" width="50" height="50" loading="lazy" /></span>
		</summary>
		<div>
			<h4 data-i18n-key="settings.sections.uis.soundpacks"></h4>
			<ul class="soundpacks"></ul>
			<h2 data-i18n-key="settings.sections.uis.soundpacks.current"></h2>
			<div class="experiment-exist">
				<h3 id="soundpack-title"></h3>
				<span>(<span id="soundpack-id"></span>) v<span id="soundpack-version"></span>

		</div>
	</details>
	<details>
		<summary class="settings-section-title">
			<span data-i18n-key="settings.sections.bug"></span>
			<span><img src="/app/shared/icons/bugs.svg" width="50" height="50" loading="lazy" /></span>
		</summary>
		<textarea name="bgrep" id="bgrep" data-i18n-key="settings.sections.bug.request_generate"></textarea>
		<p id="hostname">Your hostname here</p>

	<details style="display: none" id="dev-tools">
		<summary class="settings-section-title">
			<span data-i18n-key="settings.sections.developer_tools"></span>

				Reset Changelog Accepted (Reloads)

				Force Failure for Connect
			</button>

				Open Contextual Test View
			</button>

		</summary>

</div>
<!-- <h2>This is the bottom of the Settings menu.</h2> -->
<script type="module">
	import "/app/settingsThemes.js";
	loadThemeListing();
//				universal.uiSounds.playSound("devmode");

	function restChnglog() {
		universal.send(
			universal.events.default.server_flag_updated,
			setToLocalCfg("app.freedeck.last_changelog_viewed", null),
		);
	}
	window.restChnglog = restChnglog;

/**
 * universal.flags.toggle("recompile-tab");
		universal.reloadRight();
		*/

	import {
		locales,
		localeDescriptions,
		setLocale,
		translationKey,
	} from "/app/shared/localization.js";
	Object.keys(locales).forEach((locale) => {
		const container = document.createElement("div");
		container.classList.add("theme");
		if(universal.load("locale") == locale) {
			container.style.background = "var(--selected-item-bg)";
			container.style.backgroundSize = "var(--selected-item-bg-size)";
			container.style.animation = "var(--selected-item-bg-anim)";
		}
		const title = document.createElement("h2");
		title.innerText = locales[locale];
		const desc = document.createElement("p");
		desc.innerText = localeDescriptions[locale];
		const applicator = document.createElement("button");
		container.appendChild(title);
		container.appendChild(desc);
		container.onclick = () => {
			setLocale(locale);
			window.location.reload();
		};
		document.querySelector("#language-list").appendChild(container);
	});

	document.querySelector("#hostname").innerText =
		"Hostname: " + universal._information.hostname;

	const seen = {};

	Object.keys(universal.plugins).forEach((plugin) => {
		const req = universal.plugins[plugin];
		const li = document.createElement("li");
		li.setAttribute("hovereffect", "yes");
		li.style.cursor = "default";
		if (seen[req.name]) return;
		seen[req.name] = true;

		const imgEle = document.createElement("img");
		if(!universal.plugins[plugin].icon) {
			(async () => {
				let ex = false;
				await fetch("/user-data/hooks/" + req.id+"-icon.png").then((r) => {
					if(r.status == 200) ex = true;
				})
				if(ex) {
					imgEle.src = "/user-data/hooks/" + req.id+"-icon.png";
				}
			})();
			if(req.packageType == "theme") {
				imgEle.src = "/app/shared/icons/theme-icon.png";
			}
			universal.plugins[plugin].icon = imgEle.src;
		} else {
			imgEle.src = req.icon;
		}
		const infoEle = document.createElement("div");
		infoEle.appendChild(imgEle);
		infoEle.classList.add("plugin-information");

		const nameEle = document.createElement("h3");
		nameEle.innerText = req.name;
		infoEle.appendChild(nameEle);
		const versionEle = document.createElement("p");
		versionEle.innerText = req.version ? "v" + req.version : "";
		infoEle.appendChild(versionEle);
		const authorEle = document.createElement("p");
		authorEle.innerText = "by " + req.author;
		infoEle.appendChild(authorEle);
		li.appendChild(infoEle);

		if (req.popout) {
			const popout = document.createElement("details");
			popout.innerHTML = `<summary>Settings</summary><br><div class='popout'>${req.popout}</div>`;
			infoEle.appendChild(popout);
		}

		const actionContainer = document.createElement("div");
		actionContainer.classList.add("flex-wrap");
		actionContainer.style.justifyContent = "space-between";

		const a = document.createElement("button");
		a.innerText = "Disable";
		a.onclick = () => {
			universal.uiSounds.playSound("int_confirm");
			window.UniversalUI.show.showPick(
				"Are you sure you want to disable " + req.name + "?",
				[
					{ name: "Yes", value: true },
					{ name: "No", value: false },
				],
				({ modal, value }) => {
					if (value.value == true) {
						const pb = window.UniversalUI.show.progressBar(
						universal.translationKey("settings.sections.plugins"),
						"Disabling",
						0,
						false,
					);
						universal.on(universal.events.default.disable_plugin, (state) => {
							pb.setPercent(state.percent)
							if(state.data) {
								pb.setStage(universal.translationKey(state.stage).replace("$1", state.data));
							} else {
								pb.setStage(universal.translationKey(state.stage));
							}
						})
						universal.send(universal.events.default.disable_plugin, req.id);
					}
				},
			);
			// universal.send(universal.events.default.disable_plugin, req.id);
		};
		const b = document.createElement("button");
		b.innerText = "Reload";
		b.onclick = () => {
			universal.uiSounds.playSound("int_yes");
			universal.send(universal.events.default.reload_single_plugin, req.id);
		};
		actionContainer.appendChild(a);
		actionContainer.appendChild(b);
		li.appendChild(actionContainer);
		if (req.intents && !req.intents.includes(0xf0)) {
			document.querySelector("#actl").appendChild(li);
		} else if (!req.intents) {
			document.querySelector("#actl").appendChild(li);
		}

		const types = req.types;
		types.forEach((dataObj) => {
			const tmpBtn = document.createElement("button");
			tmpBtn.innerText = dataObj.name + ": " + dataObj.type;
			tmpBtn.onclick = (ev) => {
				universal.send(universal.events.keypress, {
					event: ev,
					btn: { uuid: 0, name: dataObj.name, type: dataObj.type },
				});
			};
			document.querySelector(".btns").appendChild(tmpBtn);
		});
	});

	if(universal._information.disabled.length == 0) document.querySelector("#disbl-plg").style.display='none';

	universal._information.disabled.forEach((plugin) => {
		if (seen[plugin]) return;
		seen[plugin] = true;
		const a = document.createElement("button");
		a.innerText = "Enable " + plugin.split(".disabled")[0].split(".")[0];
		a.onclick = () => {
			console.log(plugin);
			universal.uiSounds.playSound("int_confirm");
			universal.send(universal.events.default.enable_plugin, plugin);
			const pb = window.UniversalUI.show.progressBar(
				universal.translationKey("settings.sections.plugins"),
				`Enabling ${universal.cleanHTML(plugin.split(".disabled")[0])}!`,
				0,
				false,
			);
			let p = 0;
			setInterval(() => {
				pb.setPercent(p++)
			},10);
		};
		document.querySelector("#disbl-list").appendChild(a);
	});

	document.querySelector("#upd").onclick = () => {
		const pb = window.UniversalUI.show.progressBar(
			universal.translationKey("settings.sections.plugins"),
			"Reloading all plugins, Freedeck will automatically reload.",
			0,
			false,
		);
		let p = 0;
		setInterval(() => {
			pb.setPercent(p++)
		},10);
		universal.uiSounds.playSound("int_yes");
		universal.send(universal.events.default.update_plugins);
	};

	document.querySelector("#plst").onclick = () => {
		universal.vopen("settings_plugins")
	};

	document.querySelector(".version").innerText =
		universal._information.version.human;

	async function getAudioOutputDevices(isCable = false) {
		const devices = await navigator.mediaDevices.enumerateDevices();
		const audioOutputs = devices
			.filter(
				(device) =>
					device.kind === "audiooutput" &&
					(isCable
						? device.label.includes("VB-Audio")
						: !device.label.includes("VB-Audio")),
			)
			.map((device) => ({
				name: device.label || "Unknown Audio Output",
				value: device.deviceId,
			}));
		return audioOutputs;
	}
	const outs = await getAudioOutputDevices();
	const ins = await getAudioOutputDevices(true);
	const monitor = document.querySelector(".monitor-devices");
	const vbs = document.querySelector(".vb-cables");
	outs.forEach((out) => {
		const container = document.createElement("div");
		container.classList.add("audio-device");
		const input = document.createElement("input");
		input.type = "checkbox";
		input.name = "monitor";
		input.value = out.value;
		input.id = out.value;
		input.checked = universal.audioClient.sinkManager.hasSink(out.value);
		input.onchange = (e) => {
			let isChecked = e.target.checked;
			if (isChecked && !universal.audioClient.sinkManager.hasSink(out.value)) {
				universal.audioClient.sinkManager.addSink(
					universal.audioClient.sinkManager.types.monitor,
					out.value,
				);
				universal.uiSounds.playSound("select_option");
			} else if (
				!isChecked &&
				universal.audioClient.sinkManager.hasSink(out.value)
			) {
				universal.audioClient.sinkManager.removeSink(out.value);
				universal.uiSounds.playSound("select_option_false");
			}
		};
		const label = document.createElement("label");
		label.htmlFor = out.value;
		label.innerText = out.name;
		container.appendChild(label);
		container.appendChild(input);
		monitor.appendChild(container);
	});
	ins.forEach((out) => {
		const container = document.createElement("div");
		container.classList.add("audio-device");
		const input = document.createElement("input");
		input.type = "checkbox";
		input.name = "vb";
		input.value = out.value;
		input.id = out.value;
		input.checked = universal.audioClient.sinkManager.hasSink(out.value);
		input.onchange = (e) => {
			let isChecked = e.target.checked;
			if (isChecked && !universal.audioClient.sinkManager.hasSink(out.value)) {
				universal.audioClient.sinkManager.addSink(
					universal.audioClient.sinkManager.types.vbcable,
					out.value,
				);
			} else if (
				!isChecked &&
				universal.audioClient.sinkManager.hasSink(out.value)
			) {
				universal.audioClient.sinkManager.removeSink(out.value);
			}
		};
		const label = document.createElement("label");
		label.htmlFor = out.value;
		label.innerText = out.name;
		container.appendChild(label);
		container.appendChild(input);
		vbs.appendChild(container);
	});

	getElement("#fsw").onclick = () => {
		universal.save("has_setup", false);
		window.location.reload();
	};

	getElement("#genr").onclick = () => {
		const bgrep = getElement("#bgrep");
		const report = bgrep.value;
		bgrep.value = "Generating report...";
		const rep = universal.ExportReportData();
		bgrep.value = rep;
		universal.uiSounds.playSound("int_yes")
	};

	getElement("#genru").onclick = () => {
		const bgrep = getElement("#bgrep");
		const report = bgrep.value;
		bgrep.value = "Generating report...";
		const rep = universal.ExportReportData();
		bgrep.value = rep;
		const formData = new URLSearchParams({ bug_report_data: rep, key: "Freedeck_Hello_Pls_dont_abuse_TY" });
		fetch("https://content-dl.freedeck.app/upload_bug_report.php", {
			method: "POST",
			body: formData
		}).then((res) => res.text()).then((res) => {
			const url = new URL("https://github.com/freedeck/freedeck/issues/new");
			url.searchParams.append("body", "\n-> Auto-created by " + universal._information.version.human+"\n\nBug Report Data (identifier): test4-" + res)
			window.open(url, "_blank")
		})
		universal.uiSounds.playSound("uploaded")
	};

	getElement("#read-bgrep").onclick = () => {
		const input = getElement("#input-bgrep");
		const report = input.value;
		const details = getElement(".report-details");
		details.innerHTML = "";
		const data = JSON.parse(report);
		appendDetails(details, data);
	};

	getElement("#erals").onclick = () => {
		//(NO UNDOING, WILL HAPPEN ON CLICK.)
		window.UniversalUI.show.showYesNo(
			"Are you sure you want to erase the LocalStorage?",
			"Upon clicking Continue, your LocalStorage will be completely cleared. Most local configuration will be lost, minus your Tiles. THIS IS THE LAST WARNING.",
			(yes) => {
				localStorage.clear();
				universal.sendToast(
					"Erased all LocalStorage data! Cleaning up...",
					"Settings: Developer Tools",
				);
				window.location.reload();
			},
			() => { },
		);
	};

	document.querySelector("#dev-tools").style.display =
		universal.getServerFlags()["app.freedeck.developer_mode"]
			? "block"
			: "none";
	document.querySelector(".soundpack").style.display =
		universal.getServerFlags()["app.freedeck.ui_sounds"]
			? "block"
			: "none";
	document.querySelector("#soundpack-id").innerText =
		universal.uiSounds.info.id;
	document.querySelector("#soundpack-title").innerText =
		universal.uiSounds.info.name;
	document.querySelector("#soundpack-version").innerText =
		universal.uiSounds.info.version;
	document.querySelector("#soundpack-author").innerText =
		universal.uiSounds.info.author;

	function loadUISoundListing() {
		const uis = document.querySelector(".uisounds");
		uis.innerHTML = "";
		const uisounds = universal.uiSounds.sounds;
		Object.keys(uisounds).forEach((sound) => {
			const li = document.createElement("li");
			li.innerText = sound;
			li.onclick = () => {
				universal.uiSounds.playSound(sound);
			};
			uis.appendChild(li);
		});
	}

	universal._information.soundpacks.forEach((soundpack) => {
		const li = document.createElement("li");
		li.innerText = soundpack.split(".soundpack")[0];
		li.classList.add("soundpack");
		li.onclick = async () => {
			document.querySelector("#soundpack-id").innerText = "LOADING";
			document.querySelector("#soundpack-title").innerText = "LOADING";
			document.querySelector("#soundpack-version").innerText = "LOADING";
			document.querySelector("#soundpack-author").innerText = "LOADING";
			document.querySelectorAll(".soundpack").forEach((el) => {
				el.disabled = true;
			});
			const res = await fetch(
				"/app/shared/sounds/" + soundpack + "/manifest.fdsp.json",
			);
			const data = await res.json();
			const info = data.info;
			universal.save("soundpack", info.id);
			universal.uiSounds.reload();
			universal.uiSounds.load(info.id).then(() => {
				loadUISoundListing();
			});
			document.querySelector("#soundpack-id").innerText = info.id;
			document.querySelector("#soundpack-title").innerText = info.name;
			document.querySelector("#soundpack-version").innerText = info.version;
			document.querySelector("#soundpack-author").innerText = info.author;
			document.querySelectorAll(".soundpack").forEach((el) => {
				el.disabled = false;
			});
		};
		document.querySelector(".soundpacks").appendChild(li);
	});

	function appendDetails(parent, data, isUniversal = false) {
		Object.keys(data).forEach((key) => {
			const detail = document.createElement("details");
			const summary = document.createElement("summary");
			summary.innerText = key;
			if (isUniversal) {
			}
			detail.appendChild(summary);

			if (typeof data[key] === "object" && data[key] !== null) {
				appendDetails(detail, data[key]);
			} else {
				summary.innerText += " = " + data[key];
			}

			parent.appendChild(detail);
		});
	}

	function getElement(s) {
		return document.querySelector(s);
	}

	function settingsViewOpen(view, name) {
		const button = document.createElement("button");
		button.innerText = name;
		button.onclick = () => {
			universal.vopen(view);
		};
		return button;
	}

	function setToLocalCfg(key, value) {
		const cfg = universal.getServerFlags();
		cfg[key] = value;
		return cfg;
	}

	const setupMenu = {
		generale: {
			key: "settings.sections.general.title",
			icon: "/app/shared/icons/settings.svg",
			options: {
				compact: {
					type: "checkbox",
					key: "settings.sections.general.compact",
					default: universal.getServerFlags()["compact"] || false,
					onchange: () => {
						universal.UI.reloadTiles();
					},
				},
				scroll: {
					type: "checkbox",
					key: "settings.sections.general.scroll",
					default: universal.getServerFlags()["scroll"] || false,
					onchange: () => {
						universal.UI.reloadTiles();
					},
				},
				"app.freedeck.ui.fill_tiles": {
					type: "checkbox",
					key: "settings.sections.general.fill",
					default:
						universal.getServerFlags()["app.freedeck.ui.fill_tiles"] ||
						false,
					onchange: () => {
						universal.UI.reloadTiles();
					},
				},
				"app.freedeck.ui_sounds": {
					type: "checkbox",
					key: "settings.sections.general.ui_sounds",
					flag: "uis",
					default:
						universal.getServerFlags()["app.freedeck.ui_sounds"] || false,
					onchange: () => {
						document.querySelector(".soundpack").style.display =
							universal.getServerFlags()["app.freedeck.ui_sounds"]
								? "block"
								: "none";
					},
				},
				"app.freedeck.tiles.force_deletion": {
					type: "checkbox",
					key: "settings.sections.general.dont_ask",
					default:
						universal.getServerFlags()[
						"app.freedeck.tiles.force_deletion"
						] || false,
				},
				"app.freedeck.sidebar.connect_tab": {
					type: "checkbox",
					key: "settings.sections.general.fdc_tab",
					default:
						universal.getServerFlags()[
						"app.freedeck.sidebar.connect_tab"
						] || false,
					onchange: () => {
						universal.reloadRight();
					},
				},
				"app.freedeck.notification_log": {
					type: "checkbox",
					key: "settings.sections.general.notification_log",
					flag: "notl",
					default:
						universal.getServerFlags()["app.freedeck.notification_log"] ||
						false,
				},
				"app.freedeck.skip_boot_animation": {
					type: "checkbox",
					key: "settings.sections.general.skip_boot_animation",
					default:
						universal.getServerFlags()[
						"app.freedeck.skip_boot_animation"
						] || false,
				},
				"app.freedeck.no_preset_tiles": {
					type: "checkbox",
					key: "settings.sections.experiments.no_preset_tiles",
					default:
						universal.getServerFlags()["app.freedeck.no_preset_tiles"] ||
						false,
				},
				"app.freedeck.demo.disable_new_repo": {
					handler: "flag",
					type: "checkbox",
					key: "settings.sections.experiments.disable_new_repo",
					default:
						universal.flags.isEnabled("app.freedeck.demo.disable_new_repo") ||
						false,
				},
				"app.freedeck.developer_mode": {
					type: "checkbox",
					key: "settings.sections.debug.developer_mode",
					default:
						universal.getServerFlags()[
						"app.freedeck.developer_mode"
						] || false,
					onchange: () => {
						document.querySelector("#dev-tools").style.display =
							universal.getServerFlags()["app.freedeck.developer_mode"]
								? "block"
								: "none";
					},
				},
			},
		},
	};

	document.querySelectorAll("settings").forEach((el) => {
		const details = document.createElement("details");
		const summary = document.createElement("summary");
		details.appendChild(summary);

		const _setupMenu = setupMenu[el.getAttribute("section")];
		if (!_setupMenu) return;
		el.parentNode.replaceChild(details, el);

		const title = document.createElement("p");
		title.setAttribute("data-i18n-key", _setupMenu.key);
		title.innerText = universal.translationKey(_setupMenu.key);
		summary.classList.add("settings-section-title");
		summary.prepend(title);
		const icon = document.createElement("img");
		icon.src = _setupMenu.icon;
		icon.width = 50;
		icon.height = 50;
		icon.loading = "lazy";
		summary.appendChild(icon);

		const settingsList = document.createElement("div");
		settingsList.classList.add("experiments");
		details.appendChild(settingsList);

		const options = _setupMenu.options;
		const container = document.createElement("div");
		container.classList.add("experiments");

		for (const optionId in options) {
			const option = options[optionId];
			const translationKey = option.key;
			const optContainer = document.createElement("div");
			optContainer.classList.add("experiment");
			const label = document.createElement("label");
			label.setAttribute("data-i18n-key", translationKey);
			label.setAttribute("for", optionId);
			label.innerText = universal.translationKey(option.key);
			const input = document.createElement("input");
			input.type = option.type;
			input.id = optionId;
			input.checked = option.default;
			input.onchange = () => {
				if (option.handler === "flag") {
					universal.flags.set(optionId, "" + input.checked);
				} else {
					universal.send(
						universal.events.default.server_flag_updated,
						setToLocalCfg(optionId, input.checked),
					);
				}
				if (input.checked) {
					universal.uiSounds.playSound("select_option");
				} else {
					universal.uiSounds.playSound("select_option_false");
				}
				if (option.onchange) option.onchange(input.checked);
			};
			optContainer.appendChild(label);
			optContainer.appendChild(input);
			container.appendChild(optContainer);
		}
		settingsList.appendChild(container);
	});

	loadUISoundListing();
</script>
