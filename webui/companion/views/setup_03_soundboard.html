<h1 class="settings-section-title">
	<span data-i18n-key="setup.soundboard.title"></span>
	<span><img src="/app/shared/icons/t_audio.svg" width="50" height="50" loading="lazy" /></span>
</h1>
<div class="items">

<div class="item">
	<h1 data-i18n-key="settings.sections.audio_devices.monitor"></h1>
	<p data-i18n-key="setup.soundboard.monitor.description"></p>
	<div class="monitor-devices audio-device-picker"></div>
</div>
<div class="item vbc">
	<h1 data-i18n-key="settings.sections.audio_devices.vb"></h1>
	<p>
		<span data-i18n-key="setup.soundboard.vb.description"></span>
		<a target="_blank" href="https://vb-audio.com/Cable/">https://vb-audio.com/Cable (<span data-i18n-key="action.inline.click_here"></span>)</a>
	</p>
	<div class="vb-cables audio-device-picker"></div>
</div>
<div class="item">
	<p><span data-i18n-key="sidebars.left.footer.need_help"></span> <a target="_blank" href="https://docs.freedeck.app/setting-up-soundboard" data-i18n-key="setup.soundboard.vb.click_check"></a></p>
</div>
<button id="nexta">Next</button>

</div>
<style>
	#ctxl-view-cont {
		background: rgba(0, 0, 0, 0.825);
	}

	#keys {
		display: none;
	}

	.items {
		display: flex;
		flex-direction: column;
		gap: 1rem;
	}

	#setup_03_soundboard {
		width: 100% !important;
		margin: 0 !important;
		display: inline-flex;
		flex-direction: row;
		justify-content: center;
	}

	#setup_03_soundboard body {
		width: 80% !important;
		padding-left: 0 !important;
	}

	.audio-device-picker {
		display: flex;
		flex-direction: column;
		flex-wrap: wrap;
		gap: 0.5rem;
		background-color: rgba(0, 0, 0, 0.25);
		padding: 0.5rem;
		border-radius: var(--main-radius);
	}

	.audio-device label {
		width: 100%;
	}

	.audio-device {
		display: flex;
		align-items: center;
		justify-content: start;
		padding: 0.25rem;
		gap: 0.5rem;
		border-radius: var(--main-radius);
		background-color: rgba(0, 0, 0, 0.25);
	}

	.item {
		background-color: rgba(0, 0, 0, 0.25);
		padding: 5px;
		border-radius: var(--main-radius);
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: start;
		height: max-content;
	}
</style>

<script>
	universal.reloadRight();
	document.querySelector("#nexta").onclick = (e) => {
		universal.ctx.destructiveView("setup_04_device");
	}

	async function getAudioOutputDevices(isCable = false) {
		const devices = await navigator.mediaDevices.enumerateDevices();
		const audioOutputs = devices
			.filter(
				(device) =>
					device.kind === "audiooutput" &&
					(isCable
						? device.label.includes("VB-Audio")
						: !device.label.includes("VB-Audio")),
			)
			.map((device) => ({
				name: device.label || "Unknown Audio Output",
				value: device.deviceId,
			}));
		return audioOutputs;
	}
	const outs = await getAudioOutputDevices();
	const ins = await getAudioOutputDevices(true);
	const monitor = document.querySelector(".monitor-devices");
	const vbs = document.querySelector(".vb-cables");
	outs.forEach((out) => {
		const container = document.createElement("div");
		container.classList.add("audio-device");
		const input = document.createElement("input");
		input.type = "checkbox";
		input.name = "monitor";
		input.value = out.value;
		input.id = out.value;
		input.checked = universal.audioClient.sinkManager.hasSink(out.value);
		input.onchange = (e) => {
			let isChecked = e.target.checked;
			if (isChecked && !universal.audioClient.sinkManager.hasSink(out.value)) {
				universal.audioClient.sinkManager.addSink(universal.audioClient.sinkManager.types.monitor, out.value);
			} else if (!isChecked && universal.audioClient.sinkManager.hasSink(out.value)) {
				universal.audioClient.sinkManager.removeSink(out.value);
			}
		};
		const label = document.createElement("label");
		label.htmlFor = out.value;
		label.innerText = out.name;
		container.appendChild(label);
		container.appendChild(input);
		monitor.appendChild(container);
	});
	ins.forEach((out) => {
		const container = document.createElement("div");
		container.classList.add("audio-device");
		const input = document.createElement("input");
		input.type = "checkbox";
		input.name = "vb";
		input.value = out.value;
		input.id = out.value;
		input.checked = universal.audioClient.sinkManager.hasSink(out.value);
		input.onchange = (e) => {
			let isChecked = e.target.checked;
			if (isChecked && !universal.audioClient.sinkManager.hasSink(out.value)) {
				universal.audioClient.sinkManager.addSink(universal.audioClient.sinkManager.types.vbcable, out.value);
			} else if (!isChecked && universal.audioClient.sinkManager.hasSink(out.value)) {
				universal.audioClient.sinkManager.removeSink(out.value);
			}
		};
		const label = document.createElement("label");
		label.htmlFor = out.value;
		label.innerText = out.name;
		container.appendChild(label);
		container.appendChild(input);
		vbs.appendChild(container);
	});
</script>
