<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
	<meta http-equiv="X-UA-Compatible" content="ie=edge" />
	<link rel="stylesheet" href="/style/style.css" />
	<link rel="stylesheet" href="/companion/companion.css" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Freedeck" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
	<title>FD Overlay</title>
</head>
<style>
	#keys {
		display: none;
	}

	#ctxl-view-cont {
		background-color: transparent;
	}

	#ctxl-view-cont html body {
		width: auto;
		height: auto;
		margin: auto;
		padding-left: 0 !important;
	}

	body {
		background: transparent;
	}

	.dash-module {
		transition-duration: 0.125s;
	}

	.dash-button {
		z-index: 1001 !important;
	}

	.dash-module:hover {
		cursor: grab;
	}

	.dash-module.dragging {
		transform: rotate(2deg);
		box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
		filter: opacity(0.9);
		cursor: grabbing;
	}

	#dragmode-warning,
	#debugmode-warning {
		display: none;
	}

	.debug-only {
		display: none;
	}

	.alpha-warning,
	.debug-only {
		background: var(--modal-bg);
		padding: 0.5rem;
		border: var(--generic-border);
		border-radius: var(--main-radius);
	}

	.warnings {
		position: absolute;
		bottom: 0;
		left: 0;
		margin: var(--main-radius);
		display: flex;
		flex-direction: column;
		gap: 0.5rem;
	}

	#boot-log-div {
		display: none !important;
	}
</style>

<body style="overflow: hidden">
	<script src="/socket.io/socket.io.js"></script>
	<script src="/common/error.js" type="module"></script>
	<script src="/app/universal.js" type="module"></script>
	<div style="display: none; z-index: 10200" class="modal" id="login-dialog">
		<div id="login-div" class="modalContent">
			<h1 id="login-msg">Login to Freedeck</h1>
			<p>Enter the password to gain access.</p>
			<input type="password" id="password" />
			<br />
			<div class="flex-wrap-r">
				<button onclick="universal.login(document.getElementById('password').value)">
					Login
				</button>
				<button onclick="window.location.reload();">Reload</button>
			</div>
		</div>
	</div>
	<span class="warnings">
		<span class="alpha-warning" id="debugmode-warning"><strong>Debug Mode is activated.</strong> Above text is the
			on-screen
			module data.</span>
		<span class="alpha-warning" id="dragmode-warning">Edit mode activated. Click and drag a module to move it.</span>
		<!-- <span class="alpha-warning">
			Freedeck Overlay is in <strong>BETA</strong>.
		</span>
		<span class="alpha-warning">
			Press 'd' to start drag mode, 'f' for debug mode, and 'r' to reload all
			modules.
		</span> -->
	</span>
	<script type="module">
		import layoutDefinition from "./layout.js";
		import mctx from "/dash/ctxl2.js";
		window.mctx = mctx;
		await universal.init("Overlay", "Freedeck Overlay");
		let dragMode = false;
		let debugMode = false;
		const debugContainer = document.querySelector(".warnings");
		const dragWarning = document.querySelector("#dragmode-warning");
		const debugWarning = document.querySelector("#debugmode-warning");

		window.addEventListener("keydown", async (e) => {
			if (e.key === "d") dragMode = !dragMode;
			if (e.key === "f") debugMode = !debugMode;
			if (e.key === "r") reloadModules();
			if (e.key === "n") {
				const viewCollection = [];
				for (const k in universal.plugins) {
					const i = universal.plugins[k]
					if (i.dashModules) {
						for (const n in i.dashModules) {
							viewCollection.push(n)
						}
					}
				}
				const selections = {};
				for (const i of viewCollection) {
					fetch("/user-data/dash-modules/" + i + "/module.json")
						.then((res) => {
							return res.json();
						})
						.then((ares) => {
							selections[ares.name] = [];
							for (const viw of ares.views) {
								fetch(`/user-data/dash-modules/${i}/${viw}/module.json`)
									.then((res) => {
										return res.json();
									})
									.then((res) => {
										selections[ares.name].push(res);
									})
							}
						})
				}
				for (const selectionName in selections) {
					const data = selections[selectionName];

				}
			}

			dragWarning.style.display = dragMode ? "block" : "none";
			debugWarning.style.display = debugMode ? "block" : "none";

			freedeckoverlay.setIgnoreEvents(!dragMode);

			if (dragMode) {
				document.querySelector("body").style.backgroundColor = 'rgba(12,12,12,0.25)';
				document.querySelector("body").style.backgroundImage = 'url(/overlay/grid.svg)';
				document.querySelector("body").style.animation = 'none';
			} else {
				document.querySelector("body").style.backgroundColor = 'rgba(0,0,0,0)';
				document.querySelector("body").style.backgroundImage = '';
			}

			if (debugMode) {
				document.querySelectorAll(".debug-only").forEach((enrty) => {
					enrty.style.display = "block";
				});
			} else {
				document.querySelectorAll(".debug-only").forEach((enrty) => {
					enrty.style.display = "none";
				});
			}
		});
		reloadModules();

		function reloadModules() {
			document.querySelectorAll(".debug-only").forEach((enrty) => {
				enrty.remove();
			});
			for (const i of mctx.opened) {
				mctx.closeView(i);
			}
			document.querySelectorAll(".dash-button").forEach((e) => e.remove());
			for (const module of layoutDefinition.modules) {
				const name = Object.keys(module)[0];
				const trueData = module[name];
				if (trueData.renderType == "dash-module")
					renderModule(trueData, name);
				if (trueData.renderType == "dash-button") {
					const view = document.createElement("button");
					view.innerText = name;
					view.classList.add("dash-button");
					view.style.position = "absolute";
					view.style.top = trueData.data.position.x + "px";
					view.style.left = trueData.data.position.y + "px";
					view.classList.add("dash-module");
					view.style.overflow = "hidden";
					if (trueData.data.position.width !== "defined") {
						view.style.width = trueData.data.position.width + "px";
					} else {
						view.style.width = "min-content";
					}
					if (trueData.data.position.height !== "defined") {
						view.style.height = trueData.data.position.height + "px";
					} else {
						view.style.height = "min-content";
					}
					let isDragging = false;
					let startX = 0;
					let startY = 0;
					view.addEventListener("mouseenter", (e) => {
						freedeckoverlay.setIgnoreEvents(false)
					})
					view.addEventListener("mouseleave", (e) => {
						if (!dragMode) freedeckoverlay.setIgnoreEvents(true)
					})
					view.addEventListener("click", (event) => {
						if (!dragMode) {
							universal.send(universal.events.keypress, {
								event,
								btn: trueData,
							});
							return;
						}
					});
					view.addEventListener("mousedown", (event) => {
						event.stopPropagation();
						if (!dragMode) return;
						isDragging = true;
						view.classList.add("dragging");
						startX = event.clientX - view.offsetLeft;
						startY = event.clientY - view.offsetTop;
						event.preventDefault();
					});
					const handleMouseUp = (event) => {
						if (isDragging) {
							isDragging = false;
							view.classList.remove("dragging");
						}
					};

					const dataTxt = document.createElement("span");
					dataTxt.classList.add("debug-only");
					const handleMouseMove = (event) => {
						dataTxt.innerText = `${name}, ${JSON.stringify(trueData)}, (${view.style.top} ${view.style.left} ${view.style.width} ${view.style.height})`;
						if (isDragging) {
							const newX = event.clientX - startX;
							const newY = event.clientY - startY;

							// Keep within viewport bounds
							const maxX = window.innerWidth - view.offsetWidth;
							const maxY = window.innerHeight - view.offsetHeight;

							view.style.left = Math.max(0, Math.min(newX, maxX)) + "px";
							view.style.top = Math.max(0, Math.min(newY, maxY)) + "px";
						}
					};
					debugContainer.prepend(dataTxt);

					// Add event listeners
					document.addEventListener("mousemove", handleMouseMove);
					document.addEventListener("mouseup", handleMouseUp);
					document.querySelector("body").appendChild(view);
				}
			}
		}

		async function renderModule(
			trueData,
			name,
			prefix = "/user-data/dash-modules/",
		) {
			let modFound = false;
			trueData.from = prefix;
			await fetch(prefix + trueData.type + "/module.json")
				.then((res) => {
					modFound = true;
					trueData.from = prefix + trueData.type + "/module.json";
					return res.json();
				})
				.then((res) => {
					mctx.addView(`${prefix}${trueData.type}/${res.overlay}`);
					const view = mctx.nonDestructiveView(
						`${prefix}${trueData.type}/${res.overlay}`,
					);
					view.style.position = "absolute";
					view.style.top = trueData.data.position.x + "px";
					view.style.left = trueData.data.position.y + "px";
					view.classList.add("dash-module");
					view.style.overflow = "hidden";
					if (trueData.data.position.width !== "defined") {
						view.style.width = trueData.data.position.width + "px";
					} else {
						view.style.width = "min-content";
					}
					if (trueData.data.position.height !== "defined") {
						view.style.height = trueData.data.position.height + "px";
					} else {
						view.style.height = "min-content";
					}
					let isDragging = false;
					let startX = 0;
					let startY = 0;
					view.addEventListener("mousedown", (event) => {
						event.stopPropagation();
						if (!dragMode) return;
						isDragging = true;
						view.classList.add("dragging");
						startX = event.clientX - view.offsetLeft;
						startY = event.clientY - view.offsetTop;
						event.preventDefault();
					});
					const handleMouseUp = (event) => {
						if (isDragging) {
							isDragging = false;
							view.classList.remove("dragging");
						}
					};

					const dataTxt = document.createElement("span");
					dataTxt.classList.add("debug-only");
					const handleMouseMove = (event) => {
						dataTxt.innerText = `${name}, ${JSON.stringify(trueData)}, (${view.style.top} ${view.style.left} ${view.style.width} ${view.style.height})`;
						if (isDragging) {
							const newX = event.clientX - startX;
							const newY = event.clientY - startY;

							// Keep within viewport bounds
							const maxX = window.innerWidth - view.offsetWidth;
							const maxY = window.innerHeight - view.offsetHeight;

							view.style.left = Math.max(0, Math.min(newX, maxX)) + "px";
							view.style.top = Math.max(0, Math.min(newY, maxY)) + "px";
						}
					};
					debugContainer.prepend(dataTxt);

					// Add event listeners
					document.addEventListener("mousemove", handleMouseMove);
					document.addEventListener("mouseup", handleMouseUp);
				})
				.catch((e) => {
					if (prefix === "/user-data/dash-modules/") {
						renderModule(trueData, name, "/dash/modules/");
					} else {
						universal.sendToast(`Failed to add ${name}`, "Dash");
					}
				});
		}
	</script>
</body>

</html>
