<style>
	#clock {
		text-align: center;
		width: max-content;
	}
</style>
<freedeck-dash-module>
	<h1 id="clock"></h1>
</freedeck-dash-module>
<script>
	const cl = document.querySelector("#clock");
	
	const settingsEle = document.querySelector("html[ctxl-id='/dash/modules/freedeck/clock/view']")
  let settings = JSON.parse(settingsEle.getAttribute("settings"));
  settingsEle.overlaySettingsChanged = (_settings) => {
    settings = _settings;
  }
	
	function timestring() {
		return new Date().toLocaleTimeString();
	}
	cl.innerText = timestring();
	setInterval(() => {
		let ts = timestring();
		if(settings.seconds != "true") {
			// THIS IS REALLY BAD. DO NOT DO THIS
			const slices = ts.split(" ");
			const sec = slices[0].split(":");
			ts = sec[0] +":" + sec[1] + " " + slices[1]
		}
		cl.innerText = ts;
	}, 1000);
</script>
