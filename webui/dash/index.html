<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
	<meta http-equiv="X-UA-Compatible" content="ie=edge" />
	<link rel="stylesheet" href="/style/style.css" />
	<link rel="stylesheet" href="/companion/companion.css" />
	<link rel="stylesheet" href="/dash/dash.css" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Freedeck" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
	<title>Freedeck | Overlay</title>
</head>

<body style="overflow: hidden">
	<script src="/socket.io/socket.io.js"></script>
	<script src="/app/shared/error.js" type="module"></script>
	<script src="/app/universal.js" type="module"></script>
	<script src="/dash/scripts/renderer.js" type="module"></script>
	<div style="display: none; z-index: 10200" class="modal" id="login-dialog">
		<div id="login-div" class="modalContent">
			<h1 id="login-msg">Login to Freedeck</h1>
			<p>Enter the password to gain access.</p>
			<input type="password" id="password" />
			<br />
			<div class="flex-wrap-r">
				<button onclick="universal.login(document.getElementById('password').value)">
					Login
				</button>
			</div>
		</div>
	</div>
	<span class="warnings">
		<span class="alpha-warning" id="debugmode-warning"><strong>Debug Mode is activated.</strong> Above text is the
			on-screen
			module data.</span>
		<span class="alpha-warning" id="dragmode-warning">Edit mode activated. Click and drag a module to move it.</span>
		<span class="alpha-warning" id="nomods-warning">Your Dash is empty! Right click to get started.</span>
	</span>
	<div class="logo-menu" style="display:none;">
		<div id="menu" style="display: none;">
			<a href="/">Back</a>
		</div>
		<img src="/assets/overlay.png" alt="Overlay" id="overlay-btn">
	</div>
</body>

</html>
