<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/companion/companion.css" />
    <title>Freedeck</title>
</head>
<style>
  #keys {display:none;}
</style>
<body style="overflow: hidden">
  <script src="/common/error.js" type="module"></script>
  <script src="/socket.io/socket.io.js" type="module"></script>
  <script src="/app/universal.js" type="module"></script>
  <div style="display: none; z-index: 10200" class="modal" id="login-dialog">
      <div id="login-div" class="modalContent">
          <h1 id="login-msg">Login to Freedeck</h1>
          <p>Enter the password to gain access.</p>
          <input type="password" id="password" />
          <br/>
          <div class="flex-wrap-r">
              <button onclick="universal.login(document.getElementById('password').value)">
                  Login
              </button>
              <button onclick="window.location.reload();">Reload</button>
          </div>
      </div>
  </div>
  <script type="module">
  await universal.init("Dash", "Freedeck Dash")
  </script>
</body>
</html>
